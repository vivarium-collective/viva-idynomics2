[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "pbg-idynomics2"
version = "0.1.0"
description = "Process-bigraph wrapper for IDynoMiCS 2.0, the individual-based biofilm simulator"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Eran Agmon", email = "agmon.eran@gmail.com"}]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "bigraph-schema>=0.0.60",
    "process-bigraph>=0.0.66",
    "JPype1>=1.5.0",
    "bigraph-viz>=2.0.3",
    "pyyaml>=6.0",
    "jsonschema[format-nongpl]>=4.21",
    "jinja2>=3.1",
    "pypdf>=4.0",
    "matplotlib",
    "plotly",
    "vivarium-dashboard",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "bigraph-viz>=0.0.30",
    "plotly>=5",
    "numpy",
]

[project.urls]
Homepage = "https://github.com/vivarium-collective/pbg-idynomics2"
Issues = "https://github.com/vivarium-collective/pbg-idynomics2/issues"
Upstream = "https://github.com/kreft/iDynoMiCS-2"

[tool.hatch.build.targets.wheel]
packages = ["pbg_idynomics2"]

[tool.uv.sources]
# vivarium-dashboard isn't on PyPI; pull it from the public GitHub repo so
# CI (and any fresh clone) can resolve it.  Override locally with a personal
# `pyproject.toml` edit pointing at `path = "../vivarium-dashboard"` if you
# want an editable install for dashboard development.
vivarium-dashboard = { git = "https://github.com/vivarium-collective/vivarium-dashboard", branch = "main" }
